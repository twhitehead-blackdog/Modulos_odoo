[project]
name = "odoo18-mcp-server"
version = "0.1.0"
description = "MCP (Model Context Protocol) server for Odoo 18 - enables Claude to interact with Odoo instances"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Modulos Odoo"},
]
dependencies = [
    "mcp[cli]>=1.2.0,<2",
    "python-dotenv>=1.0.0",
    "pdfplumber>=0.10.0",
]

[project.scripts]
odoo18-mcp-server = "odoo_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/odoo_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/odoo_mcp"]
